services:
  frontend:
    build:
      context: ./frontend_vite
    ports:
      - "5173:5173"
    volumes:
      - ./frontend_vite:/app
      - /app/node_modules
    environment:
      - ENV=local
      - VITE_API_URL=http://localhost:8000
      - VITE_ENABLE_PHOTOS=${VITE_ENABLE_PHOTOS:-false}
      - VITE_APP_TITLE=${VITE_APP_TITLE:-Private event}
      - VITE_APP_META_DESCRIPTION=${VITE_APP_META_DESCRIPTION:-Private wedding event}
      - VITE_HONEYMOON_NAME_1=${VITE_HONEYMOON_NAME_1:-Name 1}
      - VITE_HONEYMOON_IBAN_1=${VITE_HONEYMOON_IBAN_1:-DUMMY_IBAN_1}
      - VITE_HONEYMOON_NAME_2=${VITE_HONEYMOON_NAME_2:-Name 2}
      - VITE_HONEYMOON_IBAN_2=${VITE_HONEYMOON_IBAN_2:-DUMMY_IBAN_2}
    depends_on:
      - local_server

  local_server:
    build:
      context: .
      dockerfile: ./local_server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./lambda:/app/lambda
      - ./local_server:/app/local_server
    environment:
      - ENV=local
      - AWS_REGION=eu-west-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?set in .env.local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?set in .env.local}
      - JWT_SECRET=${JWT_SECRET:?set in .env.local}
      - AWS_DEFAULT_REGION=eu-west-1
      - S3_BUCKET=wedding-photos-local
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_PUBLIC_ENDPOINT_URL=http://localhost:4566
      - SQS_ENDPOINT_URL=http://localstack:4566
      - PHOTO_PROCESSING_QUEUE_URL=http://localstack:4566/000000000000/photo-processing
      - UPLOAD_URL_EXPIRY_SECONDS=${UPLOAD_URL_EXPIRY_SECONDS:-3600}
      - UPLOAD_RECONCILIATION_DELAY_SECONDS=${UPLOAD_RECONCILIATION_DELAY_SECONDS:-14400}
      - UPLOAD_FAILED_AUDIT_RETENTION_SECONDS=${UPLOAD_FAILED_AUDIT_RETENTION_SECONDS:-172800}
      - SQS_MAX_RECEIVE_COUNT=5
    depends_on:
      - dynamodb-local
      - localstack

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8001:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=eu-west-1
      - SQS_ENDPOINT_STRATEGY=path

  photo-worker:
    build:
      context: .
      dockerfile: ./local_server/Dockerfile
    volumes:
      - ./lambda:/app/lambda
      - ./local_server:/app/local_server
    command: python /app/local_server/photo_worker.py
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=local
      - AWS_REGION=eu-west-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?set in .env.local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?set in .env.local}
      - S3_BUCKET=wedding-photos-local
      - S3_ENDPOINT_URL=http://localstack:4566
      - SQS_ENDPOINT_URL=http://localstack:4566
      - PHOTO_PROCESSING_QUEUE_URL=http://localstack:4566/000000000000/photo-processing
      - SQS_MAX_RECEIVE_COUNT=5
    depends_on:
      - dynamodb-local
      - localstack

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  init-db:
    build:
      context: .
      dockerfile: ./local_server/Dockerfile
    volumes:
      - ./scripts:/app/scripts
      - ./lambda:/app/lambda
    command: python /app/scripts/init-local-db.py
    environment:
      - ENV=local
      - AWS_REGION=eu-west-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?set in .env.local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?set in .env.local}
      - S3_ENDPOINT_URL=http://localstack:4566
      - SQS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      dynamodb-local:
        condition: service_started
      localstack:
        condition: service_started
